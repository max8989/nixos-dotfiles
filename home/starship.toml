"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](s1)\
$os\
$username\
[](bg:s2 fg:s1)\
$directory\
[](fg:s2 bg:s1)\
$git_branch\
$git_status\
[](fg:s1 bg:s2)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:s2 bg:s1)\
$docker_context\
[](fg:s1 bg:s2)\
$time\
[ ](fg:s2)\
$line_break$character"""

[os]
disabled = false
style = "bg:s1 fg:cyan"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = ""
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:s1 fg:text"
style_root = "bg:s1 fg:red"
format = '[ $user ]($style)'

[directory]
style = "fg:cyan bg:s2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:s1"
format = '[[ $symbol $branch ](fg:muted bg:s1)]($style)'

[git_status]
style = "bg:s1"
format = '[[($all_status$ahead_behind )](fg:amber bg:s1)]($style)'

[nodejs]
symbol = ""
style = "bg:s2"
format = '[[ $symbol( $version) ](fg:dim bg:s2)]($style)'

[c]
symbol = " "
style = "bg:s2"
format = '[[ $symbol( $version) ](fg:dim bg:s2)]($style)'

[rust]
symbol = ""
style = "bg:s2"
format = '[[ $symbol( $version) ](fg:dim bg:s2)]($style)'

[golang]
symbol = ""
style = "bg:s2"
format = '[[ $symbol( $version) ](fg:dim bg:s2)]($style)'

[php]
symbol = ""
style = "bg:s2"
format = '[[ $symbol( $version) ](fg:dim bg:s2)]($style)'

[java]
symbol = " "
style = "bg:s2"
format = '[[ $symbol( $version) ](fg:dim bg:s2)]($style)'

[kotlin]
symbol = ""
style = "bg:s2"
format = '[[ $symbol( $version) ](fg:dim bg:s2)]($style)'

[haskell]
symbol = ""
style = "bg:s2"
format = '[[ $symbol( $version) ](fg:dim bg:s2)]($style)'

[python]
symbol = ""
style = "bg:s2"
format = '[[ $symbol( $version) ](fg:dim bg:s2)]($style)'

[docker_context]
symbol = ""
style = "bg:s1"
format = '[[ $symbol( $context) ](fg:dim bg:s1)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:s2"
format = '[[  $time ](fg:muted bg:s2)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:green)'
error_symbol = '[](bold fg:red)'
vimcmd_symbol = '[](bold fg:green)'
vimcmd_replace_one_symbol = '[](bold fg:blue)'
vimcmd_replace_symbol = '[](bold fg:blue)'
vimcmd_visual_symbol = '[](bold fg:cyan)'
