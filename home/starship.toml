"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](s1)\
$os\
$username\
[](bg:s2 fg:s1)\
$directory\
[](fg:s2 bg:s1)\
$git_branch\
$git_status\
[](fg:s1 bg:s2)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:s2 bg:s1)\
$docker_context\
[](fg:s1 bg:s2)\
$time\
[ ](fg:s2)\
$line_break$character"""

palette = 'neon_noir'

# Neutral dark-glass segments matching the desktop theme: two alternating
# noir surfaces, icy text, cyan reserved for the OS mark and directory,
# amber/green/red only where they carry meaning (git dirty, exit status).
[palettes.neon_noir]
s1 = "#161a26"
s2 = "#1e2536"
text = "#d8f0ff"
muted = "#b8c8d8"
dim = "#66788c"
cyan = "#33ccff"
blue = "#3366ff"
green = "#00ff99"
red = "#ff3366"
amber = "#ffcc66"

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
orange = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[os]
disabled = false
style = "bg:s1 fg:cyan"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = ""
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:s1 fg:text"
style_root = "bg:s1 fg:red"
format = '[ $user ]($style)'

[directory]
style = "fg:cyan bg:s2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:s1"
format = '[[ $symbol $branch ](fg:muted bg:s1)]($style)'

[git_status]
style = "bg:s1"
format = '[[($all_status$ahead_behind )](fg:amber bg:s1)]($style)'

[nodejs]
symbol = ""
style = "bg:s2"
format = '[[ $symbol( $version) ](fg:dim bg:s2)]($style)'

[c]
symbol = " "
style = "bg:s2"
format = '[[ $symbol( $version) ](fg:dim bg:s2)]($style)'

[rust]
symbol = ""
style = "bg:s2"
format = '[[ $symbol( $version) ](fg:dim bg:s2)]($style)'

[golang]
symbol = ""
style = "bg:s2"
format = '[[ $symbol( $version) ](fg:dim bg:s2)]($style)'

[php]
symbol = ""
style = "bg:s2"
format = '[[ $symbol( $version) ](fg:dim bg:s2)]($style)'

[java]
symbol = " "
style = "bg:s2"
format = '[[ $symbol( $version) ](fg:dim bg:s2)]($style)'

[kotlin]
symbol = ""
style = "bg:s2"
format = '[[ $symbol( $version) ](fg:dim bg:s2)]($style)'

[haskell]
symbol = ""
style = "bg:s2"
format = '[[ $symbol( $version) ](fg:dim bg:s2)]($style)'

[python]
symbol = ""
style = "bg:s2"
format = '[[ $symbol( $version) ](fg:dim bg:s2)]($style)'

[docker_context]
symbol = ""
style = "bg:s1"
format = '[[ $symbol( $context) ](fg:dim bg:s1)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:s2"
format = '[[  $time ](fg:muted bg:s2)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:green)'
error_symbol = '[](bold fg:red)'
vimcmd_symbol = '[](bold fg:green)'
vimcmd_replace_one_symbol = '[](bold fg:blue)'
vimcmd_replace_symbol = '[](bold fg:blue)'
vimcmd_visual_symbol = '[](bold fg:cyan)'
